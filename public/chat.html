<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Chat</title>
  <style>
    body {
      background: linear-gradient(30deg,#ba9570,#2e2e2e, #d48c43);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px 10px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      height: 400px;
      background: linear-gradient(30deg,#ba9570,#2e2e2e, #d48c43 );
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding-top: 70px;
      border: 3px solid white;
      border-radius: 30px;
    }
    .card1{
        background: linear-gradient(30deg,#ba9570,#2e2e2e, #d48c43 ); 
        color: white;    
        border: 3px solid white;
        border-radius: 30px;
        margin: 10px;
        padding: 10px;
    }

    #chat {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(152, 14, 226, 0.15);
      padding: 20px;
      width: 100%;
      max-width: 600px;
    }

    #messages {
      max-height: 300px;
      overflow-y: auto;
    }
    .btn-brown {
    background-color: #d48c43;
    color: white;
  }
  </style>
</head>

<body>

  <!-- Join Room Card -->
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title mb-3 text-center">Join Chat Room</h5>
      <input id="username" class="form-control mb-3" placeholder="Your name" />
      <input id="room" class="form-control mb-3" placeholder="Room name" />
      <button id="join" class="btn btn-brown w-100">Join Room</button>
    </div>
  </div>

  <!-- Chat UI -->
  <div class="card1" id="chat" style="display: none">
    <ul id="messages" class="list-group mb-3"></ul>
    <div id="typing" class="text-muted mb-2"></div>
    <form id="form" class="d-flex">
      <input id="input" class="form-control me-2" autocomplete="off" placeholder="Type a message..." />
      <button class="btn btn-brown">Send</button>
    </form>
  </div>
  <script src="/socket.io/socket.io.js"></script>
  <script src="./chat.js"></script>
</body>

</html>
